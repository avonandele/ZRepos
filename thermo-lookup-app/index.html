        // ========================================================================
        // STATE MANAGEMENT
        // ========================================================================
        const state = {
            screen: 'material',
            materialData: EMBEDDED_DATA,
            selectedMaterial: null,
            selectedTable: null,
            pressureValue: '',  // Pressure for superheated tables (always required first)
            xProperty: '',
            xValue: '',
            yProperty: '',
            results: null,
            uploadStatus: '',
            unitSystem: 'metric'
        };

        // ========================================================================
        // UNIT CONVERSION FUNCTIONS
        // ========================================================================
        const conversions = {
            temperature: {
                toEnglish: (c) => (c * 9/5) + 32,
                toMetric: (f) => (f - 32) * 5/9,
                metricUnit: '°C',
                englishUnit: '°F'
            },
            pressure: {
                toEnglish: (mpa) => mpa * 145.038,
                toMetric: (psi) => psi / 145.038,
                metricUnit: 'MPa',
                englishUnit: 'psi'
            },
            v: {
                toEnglish: (m3kg) => m3kg * 16.0185,
                toMetric: (ft3lb) => ft3lb / 16.0185,
                metricUnit: 'm³/kg',
                englishUnit: 'ft³/lb'
            },
            u: {
                toEnglish: (kjkg) => kjkg * 0.429923,
                toMetric: (btulb) => btulb / 0.429923,
                metricUnit: 'kJ/kg',
                englishUnit: 'BTU/lb'
            },
            h: {
                toEnglish: (kjkg) => kjkg * 0.429923,
                toMetric: (btulb) => btulb / 0.429923,
                metricUnit: 'kJ/kg',
                englishUnit: 'BTU/lb'
            },
            s: {
                toEnglish: (kjkgk) => kjkgk * 0.238846,
                toMetric: (btulbr) => btulbr / 0.238846,
                metricUnit: 'kJ/(kg·K)',
                englishUnit: 'BTU/(lb·°R)'
            }
        };

        function getConversionType(propName) {
            const normalized = propName.toLowerCase().replace(/[\s\(\)·]/g, '');
            if (normalized.includes('temp') || normalized === 't°c' || normalized === 't°f' || normalized.startsWith('t')) return 'temperature';
            if (normalized.includes('pressure') || normalized.includes('psat') || normalized.includes('pres') || normalized.startsWith('p')) return 'pressure';
            if (normalized.startsWith('v') || normalized.includes('specificvolume')) return 'v';
            if (normalized.startsWith('u') && !normalized.includes('ufg')) return 'u';
            if (normalized.startsWith('h') && !normalized.includes('hfg')) return 'h';
            if (normalized.startsWith('s') && !normalized.includes('sfg')) return 's';
            return null;
        }

        function convertValue(value, propName, toEnglish = true) {
            const conversionType = getConversionType(propName);
            if (!conversionType || !conversions[conversionType]) return value;

            if (toEnglish) {
                return conversions[conversionType].toEnglish(value);
            } else {
                return conversions[conversionType].toMetric(value);
            }
        }

        function getUnitLabel(propName) {
            const conversionType = getConversionType(propName);
            if (!conversionType || !conversions[conversionType]) return '';

            return state.unitSystem === 'metric'
                ? conversions[conversionType].metricUnit
                : conversions[conversionType].englishUnit;
        }

        // ========================================================================
        // FILE UPLOAD HANDLER
        // ========================================================================
        async function handleFileUpload(files) {
            state.uploadStatus = 'Processing files...';
            render();

            const data = {};
            let processedCount = 0;

            for (const file of files) {
                if (!file.name.endsWith('.csv')) continue;

                const pathParts = file.webkitRelativePath ? file.webkitRelativePath.split('/') : [file.name];

                let material = 'Unknown Material';
                let tableName = file.name;

                if (pathParts.length >= 3) {
                    material = pathParts[1];
                    tableName = pathParts[2];
                } else if (pathParts.length === 2) {
                    material = pathParts[0];
                    tableName = pathParts[1];
                }

                const text = await file.text();
                const parsed = Papa.parse(text, {
                    header: true,
                    dynamicTyping: true,
                    skipEmptyLines: true
                });

                if (parsed.data.length > 0) {
                    if (!data[material]) {
                        data[material] = {};
                    }

                    data[material][tableName] = {
                        columns: parsed.meta.fields,
                        data: parsed.data.map(row => parsed.meta.fields.map(col => row[col]))
                    };

                    processedCount++;
                }
            }

            if (processedCount > 0) {
                state.materialData = data;
                state.uploadStatus = `✅ Loaded ${processedCount} tables from ${Object.keys(data).length} material(s)`;
                render();
                setTimeout(() => {
                    state.screen = 'material';
                    render();
                }, 1500);
            } else {
                state.uploadStatus = '❌ No valid CSV files found. Please upload CSV files.';
                render();
            }
        }

        // ========================================================================
        // INTERPOLATION FUNCTIONS
        // ========================================================================
        function isSuperheatedTable(tableName) {
            return tableName.toLowerCase().includes('superheated');
        }

        // 2D interpolation for superheated tables (requires P and T)
        function interpolate2D(tableData, x1Prop, x1Val, x2Prop, x2Val, yProp) {
            const { columns, data } = tableData;

            // Convert to metric if needed
            let x1ValMetric = x1Val;
            let x2ValMetric = x2Val;
            if (state.unitSystem === 'english') {
                x1ValMetric = convertValue(x1Val, x1Prop, false);
                x2ValMetric = convertValue(x2Val, x2Prop, false);
            }

            const normalize = (str) => str.toLowerCase().replace(/[\s\(\)·]/g, '');
            const normalizedCols = columns.map(normalize);
            const x1PropNorm = normalize(x1Prop);
            const x2PropNorm = normalize(x2Prop);
            const yPropNorm = normalize(yProp);

            const x1Idx = normalizedCols.indexOf(x1PropNorm);
            const x2Idx = normalizedCols.indexOf(x2PropNorm);

            if (x1Idx === -1) {
                throw new Error(`Property not found: ${x1Prop}`);
            }
            if (x2Idx === -1) {
                throw new Error(`Property not found: ${x2Prop}`);
            }

            // Find all unique values of first property (usually pressure)
            const x1Values = [...new Set(data.map(row => row[x1Idx]))].sort((a, b) => a - b);

            // Find the two pressure values that bracket our input
            let p1Idx = 0, p2Idx = 1;
            for (let i = 0; i < x1Values.length - 1; i++) {
                if (x1ValMetric >= x1Values[i] && x1ValMetric <= x1Values[i + 1]) {
                    p1Idx = i;
                    p2Idx = i + 1;
                    break;
                }
            }
            const p1 = x1Values[p1Idx];
            const p2 = x1Values[p2Idx];

            // Get rows for each pressure
            const rowsP1 = data.filter(row => row[x1Idx] === p1);
            const rowsP2 = data.filter(row => row[x1Idx] === p2);

            // Find temperature (x2) bracketing indices in each pressure group
            const findBracket = (rows, val) => {
                const x2Vals = rows.map(row => row[x2Idx]);
                for (let i = 0; i < x2Vals.length - 1; i++) {
                    if (val >= x2Vals[i] && val <= x2Vals[i + 1]) {
                        return [i, i + 1];
                    }
                }
                return [0, 1]; // Default if not found
            };

            const [t1_p1, t2_p1] = findBracket(rowsP1, x2ValMetric);
            const [t1_p2, t2_p2] = findBracket(rowsP2, x2ValMetric);

            // Get matching columns for yProp
            const matchingCols = [];
            columns.forEach((col, colIdx) => {
                const colNorm = normalize(col);
                if (colNorm.startsWith(yPropNorm) && colIdx !== x1Idx && colIdx !== x2Idx) {
                    matchingCols.push({ original: col, index: colIdx });
                }
            });

            if (matchingCols.length === 0) {
                throw new Error(`No properties found matching: ${yProp}`);
            }

            // Perform bilinear interpolation for each matching property
            const results = {};
            matchingCols.forEach(({ original, index }) => {
                // Get four corner values
                const Q11 = rowsP1[t1_p1][index]; // P1, T1
                const Q12 = rowsP1[t2_p1][index]; // P1, T2
                const Q21 = rowsP2[t1_p2][index]; // P2, T1
                const Q22 = rowsP2[t2_p2][index]; // P2, T2

                const T1 = rowsP1[t1_p1][x2Idx];
                const T2 = rowsP1[t2_p1][x2Idx];

                // Bilinear interpolation
                // First interpolate in T direction at P1
                const R1 = Q11 + (Q12 - Q11) * (x2ValMetric - T1) / (T2 - T1);
                // Then interpolate in T direction at P2
                const R2 = Q21 + (Q22 - Q21) * (x2ValMetric - T1) / (T2 - T1);
                // Finally interpolate in P direction
                const interpolatedValue = R1 + (R2 - R1) * (x1ValMetric - p1) / (p2 - p1);

                const finalValue = state.unitSystem === 'english'
                    ? convertValue(interpolatedValue, original, true)
                    : interpolatedValue;

                results[original] = finalValue;
            });

            // Check if extrapolating
            const x1Data = data.map(row => row[x1Idx]);
            const x2Data = data.map(row => row[x2Idx]);
            const minX1 = Math.min(...x1Data);
            const maxX1 = Math.max(...x1Data);
            const minX2 = Math.min(...x2Data);
            const maxX2 = Math.max(...x2Data);
            const extrapolating = x1ValMetric < minX1 || x1ValMetric > maxX1 || x2ValMetric < minX2 || x2ValMetric > maxX2;

            return {
                allValues: results,
                extrapolating,
                range: {
                    min: `${x1Prop}: ${state.unitSystem === 'english' ? convertValue(minX1, x1Prop, true) : minX1}, ${x2Prop}: ${state.unitSystem === 'english' ? convertValue(minX2, x2Prop, true) : minX2}`,
                    max: `${x1Prop}: ${state.unitSystem === 'english' ? convertValue(maxX1, x1Prop, true) : maxX1}, ${x2Prop}: ${state.unitSystem === 'english' ? convertValue(maxX2, x2Prop, true) : maxX2}`
                }
            };
        }

        // 1D interpolation for saturated tables
        function interpolate(tableData, xProp, xVal, yProp) {
            const { columns, data } = tableData;

            let xValMetric = xVal;
            if (state.unitSystem === 'english') {
                xValMetric = convertValue(xVal, xProp, false);
            }

            const normalize = (str) => str.toLowerCase().replace(/[\s\(\)·]/g, '');
            const normalizedCols = columns.map(normalize);
            const xPropNorm = normalize(xProp);
            const yPropNorm = normalize(yProp);

            const xIdx = normalizedCols.indexOf(xPropNorm);

            if (xIdx === -1) {
                throw new Error(`Property not found: ${xProp}`);
            }

            const xData = data.map(row => row[xIdx]);

            const minX = Math.min(...xData);
            const maxX = Math.max(...xData);
            const extrapolating = xValMetric < minX || xValMetric > maxX;

            let i1 = 0, i2 = 1;
            for (let i = 0; i < xData.length - 1; i++) {
                if (xValMetric >= xData[i] && xValMetric <= xData[i + 1]) {
                    i1 = i;
                    i2 = i + 1;
                    break;
                }
            }

            const x1 = xData[i1], x2 = xData[i2];

            const matchingCols = [];
            columns.forEach((col, colIdx) => {
                const colNorm = normalize(col);
                if (colNorm.startsWith(yPropNorm) && colIdx !== xIdx) {
                    matchingCols.push({ original: col, index: colIdx });
                }
            });

            if (matchingCols.length === 0) {
                throw new Error(`No properties found matching: ${yProp}`);
            }

            const results = {};
            matchingCols.forEach(({ original, index }) => {
                const y1 = data[i1][index];
                const y2 = data[i2][index];
                const interpolatedValue = y1 + (y2 - y1) * (xValMetric - x1) / (x2 - x1);

                const finalValue = state.unitSystem === 'english'
                    ? convertValue(interpolatedValue, original, true)
                    : interpolatedValue;

                results[original] = finalValue;
            });

            return {
                allValues: results,
                extrapolating,
                range: {
                    min: state.unitSystem === 'english' ? convertValue(minX, xProp, true) : minX,
                    max: state.unitSystem === 'english' ? convertValue(maxX, xProp, true) : maxX
                }
            };
        }

        // ========================================================================
        // EVENT HANDLERS
        // ========================================================================
        function handleCalculate() {
            try {
                const tableData = state.materialData[state.selectedMaterial][state.selectedTable];
                let result;

                if (isSuperheatedTable(state.selectedTable)) {
                    // Superheated table: requires pressure + another property
                    // Find the pressure column name
                    const pressureCol = tableData.columns.find(col =>
                        col.toLowerCase().includes('p') &&
                        (col.toLowerCase().includes('mpa') || col.toLowerCase().includes('kpa'))
                    );

                    if (!pressureCol) {
                        throw new Error('Pressure column not found in superheated table');
                    }

                    result = interpolate2D(
                        tableData,
                        pressureCol,
                        parseFloat(state.pressureValue),
                        state.xProperty,
                        parseFloat(state.xValue),
                        state.yProperty
                    );
                } else {
                    // Saturated table: single property lookup
                    result = interpolate(tableData, state.xProperty, parseFloat(state.xValue), state.yProperty);
                }

                state.results = result;
                state.screen = 'results';
                render();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

            let baseProp = prop;
            if (prop.includes('(') && prop.includes(')')) {
                baseProp = prop.substring(0, prop.indexOf('(')).trim();
            }

            // Clean up the property name for display
            const nameMap = {
                'temperature': 'Temperature',
                'pressure': 'Pressure',
                'psat': 'Pressure',
                'p_sat': 'Pressure',
                't': 'Temperature',
                'p': 'Pressure',

                'v_f': 'v_f', 'v_g': 'v_g', 'v_fg': 'v_fg',

                'hf': 'h_f', 'hg': 'h_g', 'hfg': 'h_fg',
                'h_f': 'h_f', 'h_g': 'h_g', 'h_fg': 'h_fg',
                'sf': 's_f', 'sg': 's_g', 'sfg': 's_fg',
                's_f': 's_f', 's_g': 's_g', 's_fg': 's_fg',
                'v': 'v', 'u': 'u', 'h': 'h', 's': 's'
            };

            const displayName = nameMap[baseProp.toLowerCase()] || baseProp;

            // Get the appropriate unit for the current system
            const unit = getUnitLabel(prop);

            if (unit) {
                return `${displayName} (${unit})`;
            }
            return displayName;
        }

                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-gray-800">Select Material</h2>
                        <button onclick="state.screen='upload'; render();" class="text-sm text-blue-600 hover:text-blue-700 underline">
                            Upload Different Files
                        </button>
                    </div>

                    <div class="bg-gradient-to-r from-blue-50 to-purple-50 border-2 border-blue-200 rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <span class="font-semibold text-gray-700">Unit System:</span>
                            <div class="flex gap-2">
                                <button onclick="state.unitSystem='metric'; render();" class="px-4 py-2 rounded-lg font-semibold transition-all ${
                                    state.unitSystem === 'metric'
                                        ? 'bg-blue-600 text-white shadow-lg'
                                        : 'bg-white text-gray-600 hover:bg-gray-100'
                                }">
                                    Metric (SI)
                                </button>
                                <button onclick="state.unitSystem='english'; render();" class="px-4 py-2 rounded-lg font-semibold transition-all ${
                                    state.unitSystem === 'english'
                                        ? 'bg-blue-600 text-white shadow-lg'
                                        : 'bg-white text-gray-600 hover:bg-gray-100'
                                }">
                                    English (IP)
                                </button>
                            </div>
                        </div>
                        <div class="text-xs text-gray-600 mt-2">
                            ${state.unitSystem === 'metric'
                                ? '°C, MPa, m³/kg, kJ/kg, kJ/(kg·K)'
                                : '°F, psi, ft³/lb, BTU/lb, BTU/(lb·°R)'}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        ${materials.map((material, idx) => `
                            <button onclick="state.selectedMaterial='${material}'; state.screen='table'; render();" class="p-4 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-left transition-colors flex items-center justify-between">
                                <span class="font-semibold">${material}</span>
                                <span class="text-sm opacity-75">${Object.keys(state.materialData[material]).length} tables</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTableScreen() {
            const tables = Object.keys(state.materialData[state.selectedMaterial]);

            // Sort tables by numerical order (A-4, A-5, A-6, A-11, A-12, etc.)
            tables.sort((a, b) => {
                const numA = parseInt(a.match(/A-(\d+)/)?.[1] || '0');
                const numB = parseInt(b.match(/A-(\d+)/)?.[1] || '0');
                return numA - numB;
            });

            return `
                <div class="space-y-4">
                    <button onclick="state.screen='material'; render();" class="flex items-center text-blue-600 hover:text-blue-700">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span>Back to Materials</span>
                    </button>

                    <h2 class="text-2xl font-bold text-gray-800">Select Table - ${state.selectedMaterial}</h2>

                    <div class="grid grid-cols-1 gap-3">
                        ${tables.map((table, idx) => `
                            <button onclick="state.selectedTable='${table}'; state.screen='properties'; render();" class="p-4 bg-green-500 hover:bg-green-600 text-white rounded-lg text-left transition-colors">
                                <div class="font-semibold">${table.replace('.csv', '')}</div>
                                <div class="text-sm opacity-75 mt-1">
                                    ${state.materialData[state.selectedMaterial][table].columns.length} properties available
                                </div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderPropertyScreen() {
            const tableData = state.materialData[state.selectedMaterial][state.selectedTable];
            const availableProps = tableData.columns;
            const isSuperheat = isSuperheatedTable(state.selectedTable);

            // Find pressure column for superheated tables
            const pressureCol = isSuperheat ? tableData.columns.find(col =>
                col.toLowerCase().includes('p') &&
                (col.toLowerCase().includes('mpa') || col.toLowerCase().includes('kpa'))
            ) : null;

            // Filter out pressure column for X property dropdown in superheated tables
            const selectableProps = isSuperheat
                ? availableProps.filter(prop => prop !== pressureCol)
                : availableProps;

            const baseProperties = [
                { key: 'T', label: 'Temperature (T)' },
                { key: 'P', label: 'Pressure (P, Psat)' },
                { key: 'v', label: 'Specific Volume (v)' },
                { key: 'u', label: 'Internal Energy (u)' },
                { key: 'h', label: 'Enthalpy (h)' },
                { key: 's', label: 'Entropy (s)' }
            ];

            // Validation for calculate button
            const canCalculate = isSuperheat
                ? (state.pressureValue && state.xProperty && state.xValue && state.yProperty)
                : (state.xProperty && state.xValue && state.yProperty);

            return `
                <div class="space-y-4">
                    <button onclick="state.screen='table'; render();" class="flex items-center text-blue-600 hover:text-blue-700">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span>Back to Tables</span>
                    </button>

                    <div class="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-4 py-2">
                        <span class="text-sm text-blue-800 font-semibold">
                            Units: ${state.unitSystem === 'metric' ? 'Metric (SI)' : 'English (IP)'}
                        </span>
                        <button onclick="state.screen='material'; render();" class="text-xs text-blue-600 hover:text-blue-700 underline">
                            Change Units
                        </button>
                    </div>

                    <h2 class="text-2xl font-bold text-gray-800">Property Lookup</h2>
                    <div class="text-sm text-gray-600">${state.selectedMaterial} → ${state.selectedTable}</div>

                    ${isSuperheat ? `
                        <div class="bg-yellow-50 border-2 border-yellow-400 rounded-lg p-3 flex items-start gap-2">
                            <svg class="text-yellow-600 flex-shrink-0 mt-0.5" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <div class="text-sm text-yellow-800">
                                <strong>Superheated Table:</strong> Requires Pressure AND one other property (typically Temperature) to define the state.
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-white p-6 rounded-lg border-2 border-gray-200 space-y-4">
                        ${isSuperheat ? `
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">
                                    ${pressureCol ? formatPropertyName(pressureCol) : 'Pressure'}:
                                </label>
                                <input type="number" step="any" id="pressureValue" value="${state.pressureValue}"
                                       oninput="state.pressureValue=this.value"
                                       placeholder="Enter pressure value"
                                       class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
                            </div>
                        ` : ''}

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                ${isSuperheat ? 'Known Property (X) - typically Temperature:' : 'Known Property (X):'}
                            </label>
                            <select id="xProperty" onchange="state.xProperty=this.value; render();" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
                                <option value="">-- Select Property --</option>
                                ${selectableProps.map(prop => `
                                    <option value="${prop}" ${state.xProperty === prop ? 'selected' : ''}>
                                        ${formatPropertyName(prop)}
                                    </option>
                                `).join('')}
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">
                                Value of ${state.xProperty ? formatPropertyName(state.xProperty) : 'X'}:
                            </label>
                            <input type="number" step="any" id="xValue" value="${state.xValue}"
                                   oninput="state.xValue=this.value"
                                   placeholder="Enter numerical value"
                                   class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Find Property (Y):</label>
                            <select id="yProperty" onchange="state.yProperty=this.value; render();" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
                                <option value="">-- Select Property --</option>
                                ${baseProperties.map(prop => `
                                    <option value="${prop.key}" ${state.yProperty === prop.key ? 'selected' : ''}>${prop.label}</option>
                                `).join('')}
                            </select>
                            <div class="text-xs text-gray-500 mt-1">
                                Will return all related values (e.g., "v" returns all specific volume properties if available)
                            </div>
                        </div>

                        <button onclick="handleCalculate()"
                                ${!canCalculate ? 'disabled' : ''}
                                class="w-full p-4 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold rounded-lg transition-colors">
                            Calculate
                        </button>
                    </div>
                </div>
            `;
        }

        function renderResultsScreen() {
            const isSuperheat = isSuperheatedTable(state.selectedTable);
            const tableData = state.materialData[state.selectedMaterial][state.selectedTable];

            // Find pressure column for superheated tables
            const pressureCol = isSuperheat ? tableData.columns.find(col =>
                col.toLowerCase().includes('p') &&
                (col.toLowerCase().includes('mpa') || col.toLowerCase().includes('kpa'))
            ) : null;

            return `
                <div class="space-y-4">
                    <button onclick="state.screen='properties'; render();" class="flex items-center text-blue-600 hover:text-blue-700">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                        <span>Back to Input</span>
                    </button>

                    <h2 class="text-2xl font-bold text-gray-800">Results</h2>

                    <div class="bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200 rounded-lg px-4 py-2 flex items-center justify-between">
                        <span class="text-sm text-blue-800 font-semibold">
                            Displaying in: ${state.unitSystem === 'metric' ? 'Metric (SI)' : 'English (IP)'}
                        </span>
                        <button onclick="state.screen='material'; render();" class="text-xs text-blue-600 hover:text-blue-700 underline">
                            Change Units
                        </button>
                    </div>

                    ${state.results.extrapolating ? `
                        <div class="bg-yellow-50 border-2 border-yellow-400 rounded-lg p-4 flex items-start gap-3">
                            <svg class="text-yellow-600 flex-shrink-0 mt-1" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            <div>
                                <div class="font-semibold text-yellow-800">Extrapolation Warning</div>
                                <div class="text-sm text-yellow-700 mt-1">
                                    ${isSuperheatedTable(state.selectedTable) ? `
                                        Input values are outside table range: [${state.results.range.min}] - [${state.results.range.max}]
                                    ` : `
                                        Input value (${state.xValue}) is outside table range [${state.results.range.min.toFixed(4)} - ${state.results.range.max.toFixed(4)}]
                                    `}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-4">
                        <div class="text-sm text-blue-700 font-semibold mb-1">Given:</div>
                        ${isSuperheat ? `
                            <div class="text-lg text-blue-900">
                                ${pressureCol ? formatPropertyName(pressureCol) : 'Pressure'} = ${state.pressureValue}
                            </div>
                            <div class="text-lg text-blue-900 mt-1">
                                ${formatPropertyName(state.xProperty)} = ${state.xValue}
                            </div>
                        ` : `
                            <div class="text-lg text-blue-900">
                                ${formatPropertyName(state.xProperty)} = ${state.xValue}
                            </div>
                        `}
                        <div class="text-sm text-blue-700 mt-2">Looking for: ${state.yProperty}</div>
                    </div>

                    <div class="bg-white border-2 border-gray-200 rounded-lg divide-y divide-gray-200">
                        <div class="px-4 py-3 bg-gray-50 font-semibold text-gray-700">
                            ${state.yProperty.toUpperCase()} Properties
                        </div>
                        ${Object.entries(state.results.allValues).map(([prop, value]) => `
                            <div class="px-4 py-3 flex justify-between items-center hover:bg-gray-50 transition-colors">
                                <span class="text-gray-700 font-medium">${formatPropertyName(prop)}</span>
                                <span class="font-mono text-lg font-semibold text-gray-900">${value.toFixed(5)}</span>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="resetApp()" class="w-full p-4 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded-lg transition-colors">
                        New Lookup
                    </button>
                </div>
            `;
        }

        function render() {
            const content = document.getElementById('content');
            let html = '';

            switch(state.screen) {
                case 'upload':
                    html = renderUploadScreen();
                    break;
                case 'material':
                    html = renderMaterialScreen();
                    break;
                case 'table':
                    html = renderTableScreen();
                    break;
                case 'properties':
                    html = renderPropertyScreen();
                    break;
                case 'results':
                    html = renderResultsScreen();
                    break;
            }

            content.innerHTML = html;

            // Attach file upload listeners after render
            if (state.screen === 'upload') {
                const folderInput = document.getElementById('folderInput');
                const filesInput = document.getElementById('filesInput');

                if (folderInput) {
                    folderInput.addEventListener('change', (e) => {
                        handleFileUpload(Array.from(e.target.files));
                    });
                }

                if (filesInput) {
                    filesInput.addEventListener('change', (e) => {
                        handleFileUpload(Array.from(e.target.files));
                    });
                }
            }
        }

        // Initial render
        render();
    </script>
</body>
</html>
